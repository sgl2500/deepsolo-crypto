[project]
name = "crypto-v2"
version = "0.1.0"
description = "Modular crypto research, backtesting, and live trading framework."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
