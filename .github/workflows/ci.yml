name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile Python
        run: python -m compileall backend scripts local-pipeline/crypto-v2/src local-pipeline/crypto-v2/scripts local-pipeline/strategy-research

      - name: Backend import smoke test
        run: PYTHONPATH=backend python -c "from app.main import app; assert app.title"

      - name: Generate sample data
        run: python scripts/generate-sample-data.py --days 1

      - name: Doctor
        run: DATA_ROOT=./sample_data/normalized_gzip python scripts/doctor.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
